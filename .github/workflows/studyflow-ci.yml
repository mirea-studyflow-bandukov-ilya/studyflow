name: Сборка и тестирование StudyFlow · практика 4.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/StudyFlow.Web/**'
      - 'tests/StudyFlow.Web.Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/StudyFlow.Web/**'
      - 'tests/StudyFlow.Web.Tests/**'

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  WEB_PROJECT: src/StudyFlow.Web/StudyFlow.Web.csproj
  TEST_PROJECT: tests/StudyFlow.Web.Tests/StudyFlow.Web.Tests.csproj

jobs:
  build-and-test:
    name: Собрать и проверить приложение ASP.NET Core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Установить .NET 8 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      - name: Восстановить зависимости NuGet
        run: dotnet restore "$TEST_PROJECT"

      - name: Собрать приложение и тесты
        run: dotnet build "$TEST_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-restore

      - name: Запустить интеграционные тесты
        id: tests
        run: |
          dotnet test "$TEST_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-build \
            --logger 'console;verbosity=normal' --logger 'trx;LogFileName=studyflow.trx' \
            --results-directory artifacts/tests

      - name: Подготовить сводку тестов
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse(Path('artifacts/tests/studyflow.trx'))
          counters = report.find('.//{*}Counters').attrib
          names = {
              'HomeReturnsRussianHtml': 'Главная страница отображается на русском',
              'HomeProvidesDocumentationLink': 'На главной есть ссылка на документацию',
              'UnknownRouteReturnsNotFound': 'Неизвестный адрес возвращает 404',
          }
          outcomes = {'Passed': 'Пройден', 'Failed': 'Ошибка', 'NotExecuted': 'Пропущен'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              print('## Интеграционные тесты StudyFlow', file=summary)
              print(f"\nСобытие запуска: `{os.environ['GITHUB_EVENT_NAME']}`  ", file=summary)
              print(f"Коммит: `{os.environ['GITHUB_SHA']}`\n", file=summary)
              print(f"Прошли: **{counters['passed']}** · Не прошли: **{counters['failed']}**\n", file=summary)
              print('| Тест | Результат |\n| --- | --- |', file=summary)
              for result in report.findall('.//{*}UnitTestResult'):
                  name = result.attrib['testName'].rsplit('.', 1)[-1]
                  outcome = result.attrib['outcome']
                  print(f"| {names.get(name, name)} | {outcomes.get(outcome, outcome)} |", file=summary)
          PY

      - name: Сохранить отчёт тестов TRX
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studyflow-test-results
          path: artifacts/tests/studyflow.trx
          if-no-files-found: error
          retention-days: 14

      - name: Опубликовать сборку приложения
        run: |
          dotnet publish "$WEB_PROJECT" --configuration "$BUILD_CONFIGURATION" --no-build \
            --output artifacts/web

      - name: Сохранить артефакт приложения
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studyflow-web
          path: artifacts/web/
          if-no-files-found: error
          retention-days: 14
