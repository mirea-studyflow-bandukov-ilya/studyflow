name: Подготовка учебных данных · практика 2.0
run-name: Parts Unlimited · ${{ inputs.mode == 'apply' && 'импорт' || 'проверка' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Проверить шаблон или добавить недостающие учебные карточки
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: read
  issues: write

concurrency:
  group: parts-unlimited-seed
  cancel-in-progress: false

jobs:
  prepare:
    name: Проверить генератор учебных данных
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Собрать генератор с шаблоном и переводом
        run: dotnet publish tools/DemoGenerator/DemoGenerator.csproj -c Release -r linux-x64 --self-contained true -o artifacts/demo-generator
      - name: Проверить шаблон и перевод
        run: ./artifacts/demo-generator/DemoGenerator --dry-run
      - name: Импортировать и проверить учебные данные
        if: inputs.mode == 'apply'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./artifacts/demo-generator/DemoGenerator --apply
      - name: Сохранить сборку, шаблон, перевод и соответствия карточек
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-generator
          path: |
            artifacts/demo-generator/
            seed-result.json
          retention-days: 14
